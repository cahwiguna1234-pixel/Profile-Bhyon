      // Theme boot — avoids FOUC. Preference persisted in localStorage.
      try {
        var t = localStorage.getItem("bhyon-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
